<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FarmTrace</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="auth"><div class="authcard"><div class="auth-settings"><div><label>Language</label><select class="lang-select" onchange="setLanguage(this.value)"></select></div><div><label>Theme</label><select class="theme-select" onchange="setTheme(this.value)"><option value="green">Green</option><option value="deep">Deep Green</option><option value="leaf">Fresh Leaf</option></select></div></div><div class="brandbig">🌱 FarmTrace</div><h1 data-i18n="digitalHistory">Digital Farm History</h1><p class="muted" data-i18n="privateWorkspace">A private digital workspace for each individual farmer. Every farm module has its own dedicated page.</p><div class="actions"><a class="btn green" href="/login" data-i18n="farmerLogin">Farmer Login</a><a class="btn light" href="/register" data-i18n="createAccount">Create Farmer Account</a></div></div></div><script src="/js/app.js"></script><script>const ls=document.querySelector('.lang-select');ls.innerHTML=Object.entries(LANGUAGES).map(([k,v])=>`<option value="${k}" ${k===currentLang()?'selected':''}>${v}</option>`).join('');document.querySelector('.theme-select').value=localStorage.getItem(THEME_KEY)||'green';translateStatic();</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Farmer Account · FarmTrace</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="auth"><div class="authcard"><div class="auth-settings"><div><label>Language</label><select class="lang-select" onchange="setLanguage(this.value)"></select></div><div><label>Theme</label><select class="theme-select" onchange="setTheme(this.value)"><option value="green">Green</option><option value="deep">Deep Green</option><option value="leaf">Fresh Leaf</option></select></div></div><div class="brandbig">🌱 FarmTrace</div><h1 data-i18n="createAccount">Create Farmer Account</h1><div id="message"></div><form id="register"><label data-i18n="name">Full name</label><input name="name" required><label data-i18n="mobile">Mobile number</label><input name="phone" inputmode="numeric" maxlength="10" required><label data-i18n="email">Email</label><input name="email" type="email"><label data-i18n="village">Village</label><input name="village"><label data-i18n="district">District</label><input name="district"><label data-i18n="state">State</label><input name="state" value="Maharashtra"><label data-i18n="password">Password</label><input name="password" type="password" minlength="6" required><label data-i18n="confirmPassword">Confirm password</label><input name="confirmPassword" type="password" minlength="6" required><br><br><button class="btn green" style="width:100%" data-i18n="createAccount">Create Account</button></form><div class="links"><a href="/" data-i18n="home">Home</a><a href="/login" data-i18n="already">Already have an account?</a></div></div></div><script src="/js/app.js"></script><script>const langSelect=document.querySelector('.lang-select');langSelect.innerHTML=Object.entries(LANGUAGES).map(([k,v])=>`<option value="${k}" ${k===currentLang()?'selected':''}>${v}</option>`).join('');document.querySelector('.theme-select').value=localStorage.getItem(THEME_KEY)||'green';translateStatic();register.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(register));d.phone=d.phone.replace(/\D/g,'');if(!d.name||!d.phone||!d.password){message.innerHTML='<div class="error">'+t('required')+'</div>';return}if(!/^\d{10}$/.test(d.phone)){message.innerHTML='<div class="error">'+t('phoneInvalid')+'</div>';return}if(d.password.length<6){message.innerHTML='<div class="error">'+t('passwordLength')+'</div>';return}if(d.password!==d.confirmPassword){message.innerHTML='<div class="error">'+t('passwordMismatch')+'</div>';return}delete d.confirmPassword;try{let r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),x=await r.json();if(!r.ok)throw Error(x.error);localStorage.setItem('farmtrace_token',x.token);localStorage.setItem('farmtrace_farmer',JSON.stringify(x.farmer));location='/dashboard'}catch(x){message.innerHTML='<div class="error">'+x.message+'</div>'}}</script></body></html>

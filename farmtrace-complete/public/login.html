<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farmer Login · FarmTrace</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="auth"><div class="authcard"><div class="auth-settings"> <div><label>Language</label><select class="lang-select" onchange="setLanguage(this.value)"></select></div><div><label>Theme</label><select class="theme-select" onchange="setTheme(this.value)"><option value="green">Green</option><option value="deep">Deep Green</option><option value="leaf">Fresh Leaf</option></select></div></div><div class="brandbig">🌱 FarmTrace</div><h1 data-i18n="farmerLogin">Farmer Login</h1><p class="muted" data-i18n="privateWorkspace">A private digital workspace for each individual farmer. Every farm module has its own dedicated page.</p><div id="message"></div><form id="login"><label data-i18n="mobile">Mobile number</label><input id="phone" inputmode="numeric" maxlength="10" required><label data-i18n="password">Password</label><input id="password" type="password" minlength="6" required><br><br><button class="btn green" style="width:100%" data-i18n="login">Login</button></form><div class="links"><a href="/" data-i18n="home">Home</a><a href="/register" data-i18n="newFarmer">Create account</a></div></div></div><script src="/js/app.js"></script><script>const langSelect=document.querySelector('.lang-select');langSelect.innerHTML=Object.entries(LANGUAGES).map(([k,v])=>`<option value="${k}" ${k===currentLang()?'selected':''}>${v}</option>`).join('');document.querySelector('.theme-select').value=localStorage.getItem(THEME_KEY)||'green';translateStatic();login.onsubmit=async e=>{e.preventDefault();const p=phone.value.replace(/\D/g,'');if(!/^\d{10}$/.test(p)){message.innerHTML='<div class="error">'+t('phoneInvalid')+'</div>';return}try{let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:p,password:password.value})}),d=await r.json();if(!r.ok)throw Error(d.error);localStorage.setItem('farmtrace_token',d.token);localStorage.setItem('farmtrace_farmer',JSON.stringify(d.farmer));location='/dashboard'}catch(x){message.innerHTML='<div class="error">'+x.message+'</div>'}}</script></body></html>

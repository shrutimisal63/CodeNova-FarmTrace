<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ask FarmTrace · FarmTrace</title><link rel="stylesheet" href="/css/style.css"></head><body><script src="/js/app.js"></script><script>startPage("ask","Ask FarmTrace","Ask natural-language questions about your own stored farm history.");</script><div class="card"><h2 class="title">Ask about your farm</h2><form id="askForm" class="actions"><input id="question" placeholder="e.g. How much did I spend on rice?"><button class="btn green">Ask</button></form></div><div id="answer"></div><script>document.getElementById('askForm').addEventListener('submit',async e=>{e.preventDefault();let r=await api('/api/ask?q='+encodeURIComponent(document.getElementById('question').value));document.getElementById('answer').innerHTML=`<div class="card"><h2 class="title">${t('answer')}</h2><p>${esc(r.answer)}</p><h3>${t('evidence')}</h3>${r.evidence.map(x=>`<div class="notice"><b>${esc(x.type)}</b> · ${esc(x.date)} · ${esc(x.field)} · ${esc(x.crop)}<br>${esc(x.activity||x.input||x.harvest||'')} ${x.expense?' · ₹'+x.expense:''} ${x.quantity?' · '+x.quantity+' '+esc(x.unit):''}</div>`).join('')}</div>`})</script></main></body></html>

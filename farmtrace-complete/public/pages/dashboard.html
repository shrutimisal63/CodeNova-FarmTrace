<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farm Dashboard · FarmTrace</title><link rel="stylesheet" href="/css/style.css"></head><body><script src="/js/app.js"></script><script>startPage("dashboard","Farm Dashboard","Your private overview — only your records are shown.");</script><div class="grid" id="stats"></div><div class="card"><h2 class="title" data-i18n="quickActions">Quick actions</h2><div class="actions"><a class="btn green" href="/activities" data-i18n="addActivity">Add Activity</a><a class="btn light" href="/inputs" data-i18n="addInput">Add Input</a><a class="btn light" href="/expenses" data-i18n="addExpense">Add Expense</a><a class="btn light" href="/harvests" data-i18n="addHarvest">Add Harvest</a><a class="btn light" href="/ask" data-i18n="askFarmTrace">Ask FarmTrace</a></div></div><div class="card"><h2 class="title" data-i18n="privateFarmHistory">Private farm history</h2><p class="muted">Your records are linked to your individual farmer account. Ask FarmTrace uses those records as evidence.</p></div><script>api('/api/summary').then(s=>document.getElementById('stats').innerHTML=[[t('records'),s.records],[t('fields'),s.fields],[t('crops'),s.crops],[t('expenses'),'₹'+s.expenses.toLocaleString('en-IN')]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="stat">${x[1]}</div></div>`).join(''));</script></main></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Profile · FarmTrace</title><link rel="stylesheet" href="/css/style.css"></head><body><script src="/js/app.js"></script><script>startPage("profile","My Profile","Manage your individual farmer account details.");</script><div class="card"><form id="profileForm" class="formgrid"><div><label>Full name</label><input name="name"></div><div><label>Email</label><input name="email" type="email"></div><div><label>Village</label><input name="village"></div><div><label>District</label><input name="district"></div><div><label>State</label><input name="state"></div></form><br><button class="btn green" onclick="saveProfile()">Save changes</button><div id="message"></div></div><script>Object.entries(farmer||{}).forEach(([k,v])=>{let x=document.querySelector(`[name="${k}"]`);if(x)x.value=v||''});async function saveProfile(){let d=Object.fromEntries(new FormData(document.getElementById('profileForm'))),r=await api('/api/profile',{method:'PUT',body:JSON.stringify(d)});localStorage.setItem('farmtrace_farmer',JSON.stringify(r.farmer));document.getElementById('message').innerHTML='<div class="notice">'+t('profileUpdated')+'</div>'}</script></main></body></html>

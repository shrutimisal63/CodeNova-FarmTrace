<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports · FarmTrace</title><link rel="stylesheet" href="/css/style.css"></head><body><script src="/js/app.js"></script><script>startPage("reports","Reports","Summaries and CSV export from your personal farm history.");</script><div class="grid" id="stats"></div><div class="card"><h2 class="title" data-i18n="exportHistory">Export farm history</h2><p class="muted">Download only your own records as CSV.</p><button class="btn green" onclick="exportCSV()" data-i18n="exportCSV">Export CSV</button></div><script>api('/api/summary').then(s=>document.getElementById('stats').innerHTML=[[t('records'),s.records],[t('fields'),s.fields],[t('crops'),s.crops],[t('totalExpense'),'₹'+s.expenses.toLocaleString('en-IN')]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="stat">${x[1]}</div></div>`).join(''));async function exportCSV(){let a=await api('/api/records'),h=['date','type','field','crop','activity','input','expense','harvest','quantity','unit','season','notes'],c=[h.join(','),...a.map(r=>h.map(k=>`"${String(r[k]??'').replaceAll('"','""')}"`).join(','))].join('\n'),l=document.createElement('a');l.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));l.download='farmtrace-history.csv';l.click()}</script></main></body></html>

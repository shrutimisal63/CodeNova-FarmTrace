<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farm History · FarmTrace</title><link rel="stylesheet" href="/css/style.css"></head><body><script src="/js/app.js"></script><script>startPage("history","Farm History","One chronological, searchable history of your personal farm records.");</script><div class="card"><div class="actions"><input id="search" placeholder="Search field, crop, activity, season..." oninput="renderHistory()"><select id="type" onchange="renderHistory()"><option value="">All modules</option><option value="field">Fields</option><option value="crop">Crops</option><option value="activity">Activities</option><option value="input">Inputs</option><option value="expense">Expenses</option><option value="harvest">Harvests</option></select></div></div><div class="card"><h2 class="title">Your records</h2><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>Field</th><th>Crop</th><th>Activity / Item</th><th>Expense</th><th>Quantity</th><th></th></tr></thead><tbody id="records"></tbody></table></div></div><script>let all=[];api('/api/records').then(d=>{all=d;renderHistory()});function renderHistory(){let q=document.getElementById('search').value.toLowerCase(),t=document.getElementById('type').value;document.getElementById('records').innerHTML=recordRows(all.filter(r=>(!t||r.type===t)&&(!q||JSON.stringify(r).toLowerCase().includes(q))))}</script></main></body></html>

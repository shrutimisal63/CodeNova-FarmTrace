<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activities · FarmTrace</title><link rel="stylesheet" href="/css/style.css"></head><body><script src="/js/app.js"></script><script>startPage("activities","Activities","Manage your individual activities records.");</script><div class="card"><h2 class="title">Add Activitie record</h2><form id="recordForm" class="formgrid"><div><label>Date</label><input name="date" type="date" required></div><div><label>Season</label><input name="season" placeholder="Kharif 2026" data-i18n-placeholder="seasonPlaceholder"></div><div><label>Field</label><input name="field" placeholder="Field A" data-i18n-placeholder="fieldPlaceholder"></div><div><label>Crop</label><input name="crop" placeholder="Rice" data-i18n-placeholder="cropPlaceholder"></div><div><label>Activity / Item / Harvest</label><input name="activity"></div><div><label>Quantity</label><input name="quantity" type="number" step="0.01"></div><div><label>Unit</label><input name="unit" placeholder="kg, quintal, bags" data-i18n-placeholder="unitPlaceholder"></div><div><label>Expense ₹</label><input name="expense" type="number" step="0.01"></div><div class="full"><label>Notes / evidence reference</label><textarea name="notes" rows="3"></textarea></div></form><button class="btn green" onclick="saveRecord('activity')">Save record</button></div><div class="card"><h2 class="title">Your records</h2><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>Field</th><th>Crop</th><th>Activity / Item</th><th>Expense</th><th>Quantity</th><th></th></tr></thead><tbody id="records"></tbody></table></div></div><script>api('/api/records?type=activity').then(d=>document.getElementById('records').innerHTML=recordRows(d));</script></main></body></html>
